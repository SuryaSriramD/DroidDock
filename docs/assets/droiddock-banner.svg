      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#e5f2e9"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#438d74"/>
      <stop offset="1" stop-color="#174b3e"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1184" height="360" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
